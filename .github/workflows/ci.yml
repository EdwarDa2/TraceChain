name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Configure isolated test engines
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 24)"
          mongo_password="$(openssl rand -hex 24)"
          neo4j_password="$(openssl rand -hex 24)"
          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "MONGO_INITDB_ROOT_PASSWORD=$mongo_password"
            echo "NEO4J_AUTH=neo4j/$neo4j_password"
            echo "DATABASE_URL=postgresql://tracechain:$postgres_password@127.0.0.1:55432/tracechain"
            echo "MONGODB_URI=mongodb://admin:$mongo_password@127.0.0.1:27017/?authSource=admin"
            echo "NEO4J_URI=bolt://127.0.0.1:7687"
            echo "NEO4J_USER=neo4j"
            echo "NEO4J_PASSWORD=$neo4j_password"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Start isolated test engines
        run: docker compose -p tracechain_ci -f docker-compose.yml -f docker-compose.test.yml up -d --wait postgres mongodb neo4j
      - name: Integration tests
        run: npm run test:integration
      - name: Stop isolated test engines
        if: always()
        run: docker compose -p tracechain_ci -f docker-compose.yml -f docker-compose.test.yml down
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Configure isolated test engines
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 24)"
          mongo_password="$(openssl rand -hex 24)"
          neo4j_password="$(openssl rand -hex 24)"
          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "MONGO_INITDB_ROOT_PASSWORD=$mongo_password"
            echo "NEO4J_AUTH=neo4j/$neo4j_password"
            echo "DATABASE_URL=postgresql://tracechain:$postgres_password@127.0.0.1:55432/tracechain"
            echo "MONGODB_URI=mongodb://admin:$mongo_password@127.0.0.1:27017/?authSource=admin"
            echo "NEO4J_URI=bolt://127.0.0.1:7687"
            echo "NEO4J_USER=neo4j"
            echo "NEO4J_PASSWORD=$neo4j_password"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1"
            echo "OUTBOX_ENABLED=true"
          } >> "$GITHUB_ENV"
      - name: Start isolated test engines
        run: docker compose -p tracechain_e2e -f docker-compose.yml -f docker-compose.test.yml up -d --wait postgres mongodb neo4j
      - name: Migrate and seed demo data
        run: |
          npm run db:migrate
          node database/document/validators/apply-validators.mjs
          node database/document/data/seed-templates.mjs
          npm run db:seed
      - name: Build backend and frontend
        run: npm run build --workspace backend && npm run build --workspace frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start API and frontend
        shell: bash
        run: |
          npm run dev:backend > backend.log 2>&1 &
          (cd frontend && npx next start -p 3000) > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' -d '{"email":"analista@example.invalid","password":"demo-tracechain-2026"}' http://localhost:3001/api/v1/auth/login -o /dev/null && curl -sf http://localhost:3000/login -o /dev/null; then
              echo "services ready"
              exit 0
            fi
            sleep 2
          done
          echo "services did not start"; cat backend.log; cat frontend.log; exit 1
      - name: Critical path E2E
        run: npm run test:e2e
      - name: Stop isolated test engines
        if: always()
        run: docker compose -p tracechain_e2e -f docker-compose.yml -f docker-compose.test.yml down
